name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test AGE2
        run: python -m unittest discover -s AGE2/tests -p "test_*.py" -v
      - name: Test rUGP
        run: python -m unittest discover -s rUGP/tests -p "test_*.py" -v
      - name: Test localization workflow
        run: python -m unittest discover -s localization/tests -p "test_*.py" -v
      - name: Test repository policy helpers
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q AGE2 rUGP localization .github/scripts
      - name: Verify repository policy
        run: python .github/scripts/verify_repository.py

  photon-runtime:
    name: Photon runtime / Zig 0.16.0
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build and verify PF/PM production code
        shell: pwsh
        run: |
          $zig = (Get-Command zig).Source
          python rUGP/runtime/build.py --game pf --zig $zig --output "$env:RUNNER_TEMP/pf/Ages3ResT.dll" --authorize-pinned-build --verify-release-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rUGP/runtime/build.py --game pm --zig $zig --output "$env:RUNNER_TEMP/pm/Ages3ResT.dll" --authorize-pinned-build --verify-release-code
      - name: Reproduce PM image admission and verify fix with synthetic assets
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zig = (Get-Command zig).Source
          python -m rUGP.tools.images.verify_pm_production --zig $zig --output "$env:RUNNER_TEMP/pm-production-regression"
      - name: Reproduce the recorded installed runtime profiles
        shell: pwsh
        run: |
          $zig = (Get-Command zig).Source
          $authority = Get-Content -LiteralPath rUGP/evidence/photon/images/static-review-20260909/runtime-sync.json -Raw | ConvertFrom-Json
          foreach ($game in @('pf', 'pm')) {
            $binary = "$env:RUNNER_TEMP/$game-installed/Ages3ResT.dll"
            python rUGP/runtime/build.py --game $game --zig $zig --output $binary --authorize-pinned-build --speaker-color-candidate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $actual = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
            if ($actual -ne $authority.games.$game.installed_dll_sha256) { throw "Installed profile identity changed: $game" }
          }
