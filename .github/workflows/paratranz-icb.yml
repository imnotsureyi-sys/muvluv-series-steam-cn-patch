name: ParaTranz ICB pilot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅预检；关闭后创建校对 PR，不自动合并'
        type: boolean
        default: true
  push:
    branches: [codex/icb-paratranz-action-20260909]
    paths:
      - '.github/workflows/paratranz-icb.yml'
      - 'localization/tools/sync_icb_paratranz.py'
      - 'localization/tests/test_sync_icb_paratranz.py'
      - 'localization/paratranz/imperial-capital-burns/**'

permissions:
  contents: read

concurrency:
  group: paratranz-icb-pilot
  cancel-in-progress: false

jobs:
  pull:
    if: >-
      github.repository == 'imnotsureyi-sys/muvluv-series-steam-cn-patch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/icb-paratranz-action-20260909')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Refuse duplicate pending synchronization PRs
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr list --state open --limit 100 --json headRefName --jq 'any(.[]; .headRefName | startswith("codex/paratranz-icb-sync-"))')
          echo "exists=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" = true ]; then
            echo '已有帝都燃烧同步 PR 待处理；本次不创建重复 PR。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test conflict and identity safeguards
        if: steps.pending.outputs.exists != 'true'
        run: python -m unittest localization.tests.test_sync_icb_paratranz -v
      - name: Fetch and validate ICB only
        if: steps.pending.outputs.exists != 'true'
        env:
          PARATRANZ_ICB_TOKEN: ${{ secrets.PARATRANZ_ICB_TOKEN }}
        run: |
          python -m localization.tools.sync_icb_paratranz --apply --report "$RUNNER_TEMP/icb-sync-report.md"
          cat "$RUNNER_TEMP/icb-sync-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate public outputs
        if: steps.pending.outputs.exists != 'true'
        run: |
          git diff --check
          python -m unittest discover -s AGE2/tests -p 'test_*.py' -v
          python .github/scripts/verify_repository.py
      - name: Publish a review PR (manual main-branch runs only)
        if: >-
          steps.pending.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo '没有需要提交的变化。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="codex/paratranz-icb-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGE2/games/imperial-capital-burns/translations/main.ja-zh-Hans.csv AGE2/games/imperial-capital-burns/translations/speakers.ja-zh-Hans.csv AGE2/games/imperial-capital-burns/translations/choices.ja-zh-Hans.csv AGE2/games/imperial-capital-burns/translations/ui-strings.ja-zh-Hans.tsv localization/paratranz/imperial-capital-burns/baseline.json
          git add -- AGE2/evidence/translations/snapshots/imperial-capital-burns.json
          git commit --author='Yi Shen <239485544+imnotsureyi-sys@users.noreply.github.com>' -m 'sync(icb): import ParaTranz proofreading' -m 'Co-authored-by: Codex <codex@openai.com>'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title '[ParaTranz] 帝都燃烧校对同步' --body-file "$RUNNER_TEMP/icb-sync-report.md"
      - name: Dry-run boundary
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run
        run: echo '本次仅试跑，候选修改随临时 runner 回收；没有推送正文、创建同步 PR 或写回 ParaTranz。' >> "$GITHUB_STEP_SUMMARY"
