name: 补丁或运行问题 / Patch or runtime bug
description: 报告可复现的安装、文本、图片、字体、启动或成就问题。Report a reproducible patch or runtime problem.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: 游戏 / Game
      options:
        - TDA00
        - TDA01
        - TDA02
        - TDA03
        - The Imperial Capital Burns
        - Photon Flowers（仅开发版本 / development build only）
        - Photon Melodies（仅开发版本 / development build only）
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: 补丁版本或源码提交 / Release tag or source commit
      description: AGE2 玩家包填写 Release tag；Photon 开发版本填写完整 commit SHA。Use a Release tag for an AGE2 package or the full commit SHA for a Photon development build.
      placeholder: tda01-beta0.2.2，或 Photon 开发版本的完整 commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 出现了什么问题？ / What happened?
      description: 请写出准确错误、画面文字、章节／日期／路线，以及预期结果。Include the exact error, scene or route, and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 请说明游戏是否为干净安装、是否安装其他 Mod，以及 Steam 验证后结果是否变化。State whether the game was clean and which other mods were installed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图与上下文 / Screenshots and context
      description: 尽量附完整截图与前后台词；不要上传游戏容器或完整资源。Attach screenshots and context, but do not upload game archives.
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checks
      options:
        - label: 我拥有对应游戏，并且没有上传受版权保护的游戏容器或完整资源。
          required: true
        - label: 我使用了对应的 Release 补丁包；如果书写 Photon 开发版本问题时，我填写了实际测试的 commit SHA。我没有把 GitHub 源码 ZIP 当作补丁包。
          required: true
